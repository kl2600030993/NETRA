<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETRA-ROVER MONITORING SYSTEM</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
    <script src="/script.js"></script>
</head>
<body>
    <header class="topbar">
        <!-- This is for logo and title -->
        <div class="brand">
            <div class="brand-logo">N</div>
            <div>
                <h1>NETRA</h1>
                <p>Robot Mission Control</p>
            </div>
        </div>
        <!-- THis is for navigatin section -->
        <nav>
            <a href="#Dashboard">Dashboard</a>
            <a href="#Fleet">Fleet</a>
            <a href="Telemetry">Telemetry</a>
            <a href="Alerts">Alerts</a>
        </nav>
        <!-- Displays system status and live clock -->
         <div class="header-right">
            <span class="online-dot"></span>
            <span>SYSTEM ONLINE</span>
            <strong id="clock">--:--:--</strong>

         </div>
         <!-- Opens the mission this is for dsipatch mission button -->
          <buttton id="dispatch-open" type="button">+Dispatch Mission</buttton>
          
    </header>
    <main class="page">
        <section class="kpi-grid">
           
             <article class="kpi-card">
                <span>ROVERS ONLINE</span>
            <h1 id="online-count">6/6</h1>
            <p>Active rover units</p>
            </article>
            <article class="kpi-card">
                <span>AVERAGE BATTERY</span>
            <h1 id="avearge-battery">52%</h1>
            <p>Fleet Battery level</p>
            </article>
            <article class="kpi-card">
                <span>OPEN ALERTS</span>
            <h1 id="alert-count">1</h1>
            <p>Requires Attention</p>
            </article>
            <article class="kpi-card">
                <span>DISTANCE TODAY</span>
            <h1 id="distance">14.3 km</h1>
            <p>Total Submitted Distance</p>
            </article>
        </section>
    </main>
    
</body>
</html>
